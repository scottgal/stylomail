# Drop-in for the Dovecot harness container. Additive on purpose.
#
# The image is rootless and ships vendor.d/rootless.conf, which supplies the
# default_login_user, the mail uid and gid, and the port bindings. Replacing
# /etc/dovecot/dovecot.conf instead of extending it discards all of that, and the
# master then fails with "default_login_user doesn't exist: dovenull" because the
# image has only a vmail user. So this file adds two settings and nothing else.
#
# auth_allow_cleartext is the 2.4 name, and there is no 2.3 name to fall back on:
# 2.3 called it disable_plaintext_auth and 2.3 images are amd64 only, which cannot
# run on an arm64 host. See DovecotServer for the rest.
auth_allow_cleartext = yes
auth_mechanisms = plain login
