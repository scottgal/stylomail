name: console-smoke
description: >
  Drives the StyloMail operator console end to end against a throwaway Host:
  the connection the sidebar and status bar report, the decision pane over a
  decision the Host produced, feedback recorded against it, the decision
  ledger, the confirmation for a sender pause including the rule that it cannot
  be carried out until a reason is given, the connection screen, and the
  management dialogs.

  Run it through ux-scripts/run-console-smoke.sh, not directly. That script
  starts the Host these assertions are about, seeds a decision through the
  routes, and takes it all down afterwards, so the run is repeatable from any
  starting state and leaves nothing behind.

  The decision pane is at the top of this script on purpose. It is loaded when
  the window opens, and selecting anything in the sidebar clears it, because a
  detail pane still showing the previous message's decision would be wrong.
  Asserting it after a click is asserting on an empty pane.

  The decision is one the Host produced, not a fixture. console_seed_decision
  posts an assessment against a Host whose semantic provider is unreachable, so
  policy declines and records the decision with every semantic dimension
  Unavailable. Two things follow from that: it is reached over the API by the
  client the console ships, and the unavailable-is-not-zero rule is asserted
  over data nothing wrote for the test. A file fixture remains as a Debug-only
  fallback for a run with no decision to seed, and a screenshot taken from it
  must say so.

  Deliberately not covered here, with reasons:
    - Releasing a quarantine. It is a write that binds to a queue row, and no
      run can reach one: POST /v1/submissions declines when the provider is
      unavailable, so no message ever reaches a quarantined state here. The
      route's refusal is covered live, and its success path only by unit tests.
    - A message to its decision. The ledger is listable, so the ledger pane is
      driven above, but the queue listings stay empty for the same reason, and
      the join from a message row to its decision needs a row to start from.
    - Anything behind a native OS dialog. There is none yet; when the API key
      entry lands it will open one, and that is the same wall mylo records.

  Selector notes, both learned by getting them wrong first:
    - A bare selector value is a single token, so a phrase has to be quoted:
      text='two words' rather than text=two words.
    - But quoting changes the meaning, not just the parsing. text=word matches
      a substring, while text='word' is an exact match against the whole
      displayed text. So text=Quarantine also matches "Quarantined" in the
      sidebar, and a quoted sentence has to be the entire sentence.
    - For anything longer than a word, prefer a named control with a
      ContainsText matcher: it says what it means and cannot be broken by a
      trailing full stop.

default_delay: 250

actions:
  # The window opens, checks the Host, loads the senders, the first queue, and
  # the decision fixture. Waited out rather than slept through: these are round
  # trips to a real process, and a fixed sleep is a flaky test with a lucky
  # first run.
  - type: Expect
    target: "name=StatusHeadlineText"
    matcher: HasText
    value: "Connected"
    timeout: 15000

  - type: Expect
    target: "name=HostAddressText"
    matcher: ContainsText
    value: "127.0.0.1"

  - type: Expect
    target: "name=StatusDetailText"
    matcher: HasText
    value: "The Host is running and can accept mail."

  # The sidebar is filled from GET /v1/senders, which is a second round trip:
  # the status bar saying Connected only means the first one finished. Given a
  # generous timeout for that reason, and because a cold start pays for
  # connection setup on the way.
  - type: Expect
    target: "testid=pause-sender-harness"
    matcher: IsVisible
    timeout: 20000

  # Senders group under the company an operator filed them in, and the row
  # shows the label rather than the address. Both come from the listing row, so
  # this is the assertion that the sidebar does not need a call per sender.
  #
  # `text='Acme'` is exact on purpose, and both halves of that matter.
  #
  # Unquoted, `text=Acme` matches any control containing those four characters,
  # including the sender's own label "Acme outbound", so it passed with grouping
  # entirely broken: the mutation that makes every sender group under
  # "Ungrouped" turned this run green. That was measured, not guessed, and it is
  # the difference between an assertion and a decoration.
  #
  # Quoted, it is an exact match against the section header's own text, which is
  # what the grouping produces and what nothing else in the window says.
  - type: Expect
    target: "text='Acme'"
    matcher: IsVisible

  - type: Expect
    target: "text='Acme outbound'"
    matcher: IsVisible

  # Where the principal's authority came from. The harness principal is
  # configured by environment, so the row has to say so: a console that could
  # not tell a minted sender from a configured one could not say which it was
  # looking at, and revocation differs between them.
  - type: Expect
    target: "testid=detail-sender-harness"
    matcher: ContainsText
    value: "configured in the host"

  # The live feed. This Host has the Hub mapped, so the console is following it
  # rather than reading on demand, and the status bar has to say which: the two
  # states look identical in every pane and mean opposite things about whether
  # what is on screen is current. The state a console most needs to announce is
  # the one after this one, where a feed that was live stops, and that has a
  # script of its own: run-console-feed-drop-smoke.sh kills this Host mid-run to
  # reach it. console-no-feed-smoke.yaml covers the third state, a deployment
  # that never had a Hub at all.
  #
  # Asserted after the sidebar because the feed opens once the window has
  # finished loading, deliberately, so asserting it earlier would race that
  # load rather than test anything.
  - type: Expect
    target: "name=LiveFeedText"
    matcher: HasText
    value: "Live"
    timeout: 15000

  - type: Screenshot
    value: "01-connected"
    description: "The console on open: connected, senders grouped by company, live feed"

  # ---- the decision pane, over a decision the Host produced ----------------
  #
  # Not the fixture. `console_seed_decision` posts an assessment against a Host
  # whose semantic provider is unreachable, and an assessment-only call is
  # recorded in the ledger, so this is real evidence reached over
  # GET /v1/decisions/{id} by the client the console actually ships.
  #
  # What that buys is the assertion a fixture cannot make honestly: every
  # semantic dimension comes back Unavailable, so the pane is showing the
  # unavailable-is-not-zero rule over data nothing wrote for it.

  - type: Expect
    target: "text=Defer"
    matcher: IsVisible
    timeout: 20000

  - type: Expect
    target: "name=RiskIndexText"
    matcher: ContainsText
    value: "an index, not a probability"

  # The reason the pipeline declined, in its own words.
  - type: Expect
    target: "text=assessment.semantic_unavailable"
    matcher: IsVisible

  # A dimension nobody could measure reads "not measured", never 0.00. This is
  # the rule the whole project restates, asserted against a real outage.
  - type: Expect
    target: "text='not measured (unavailable)'"
    matcher: IsVisible

  # And the message it names is on the row, so the reason is followed by what
  # actually happened rather than being an assertion on its own.
  - type: Expect
    target: "text='Semantic evidence was entirely unavailable, so no assessment of this message could be made. Responsibility is declined rather than assumed; retry when the provider is reachable.'"
    matcher: IsVisible

  # Delivery timing is PreAcceptance here, so the post-delivery caveat must NOT
  # appear. A caveat shown on every decision is one nobody reads, and this is
  # the assertion that it is conditional rather than decorative.
  - type: Expect
    target: "name=PostDeliveryBanner"
    matcher: Not.IsVisible

  - type: Screenshot
    value: "02-decision-pane"
    description: "A real decision: declined, with every semantic dimension unavailable"

  # ---- feedback, against a decision the Host actually holds ---------------
  #
  # This is the write that was unreachable before a real decision existed: a
  # label binds to a decision id, so with no decision there was nothing to bind
  # one to. The assertion is on the result banner rather than the form, because
  # the banner is what an operator reads and it is where a failure would show.

  - type: Expect
    target: "name=RecordFeedbackButton"
    matcher: Not.IsEnabled

  - type: TypeText
    target: "name=FeedbackRecipientBox"
    value: "alice@example.test"

  - type: Expect
    target: "name=RecordFeedbackButton"
    matcher: IsEnabled
    timeout: 5000

  - type: Click
    target: "name=RecordFeedbackButton"

  - type: Expect
    target: "name=ActionResultText"
    matcher: ContainsText
    value: "Recorded Legitimate"
    timeout: 10000

  - type: Screenshot
    value: "03-feedback-recorded"
    description: "A label recorded against the real decision, confirmed in the result banner"

  # ---- selecting a queue clears the detail ---------------------------------
  #
  # A detail pane still showing the previous message's decision under a
  # different heading would attribute one message's reasoning to another.

  - type: Click
    target: "type=Button:has-text(Quarantined)"
    description: "Select the quarantined queue"

  - type: Wait
    value: "600"

  # On the pane, not on a control inside it: Control.IsVisible is the
  # control's own property, so RiskIndexText still reports true when its
  # container is hidden. Same trap as the confirmation bar above, walked into
  # twice.
  - type: Expect
    target: "name=DecisionPaneScroll"
    matcher: Not.IsVisible

  - type: Screenshot
    value: "04-queue-selected"
    description: "The quarantined queue selected, with the detail pane cleared"

  # ---- the empty queue says which of its two causes it is ------------------
  #
  # An empty listing here means "nothing was queued" or "nothing could be
  # queued", and only the second is a fault. Left alone the pane implies the
  # reassuring one.
  #
  # This Host has a provider key configured and an endpoint it cannot reach, so
  # it is READY as far as /health/ready is concerned and reports no failed
  # checks. That is exactly the second cause, reached without any check firing,
  # and it is why the sentence must stand on its own rather than only pointing
  # at a list of failures.

  - type: Expect
    target: "name=EmptyListDetailText"
    matcher: ContainsText
    value: "nothing could be"
    description: "The empty queue names the cause the listing itself cannot show"

  - type: Expect
    target: "name=EmptyListDetailText"
    matcher: ContainsText
    value: "no semantic provider"
    description: "Both ways of being unable to assess are named, because they fail alike"

  - type: Screenshot
    value: "04b-empty-queue-says-why"
    description: "The empty queue explaining its own emptiness"

  # ---- the pause confirmation ---------------------------------------------
  #
  # The console's whole reason for a confirmation: every action it offers is
  # consequential and audited, and the ledger records only that it happened.

  - type: Click
    target: "testid=pause-sender-harness"
    description: "Ask to pause the principal this run created"

  - type: Expect
    target: "name=PendingActionTitle"
    matcher: HasText
    value: "Pause Acme outbound"
    timeout: 5000

  - type: Expect
    target: "name=PendingActionConsequence"
    matcher: ContainsText
    value: "stop being delivered"

  # Nothing has happened yet, and the confirm cannot be pressed until the
  # reason the audit trail needs has been given.
  - type: Expect
    target: "name=ConfirmActionButton"
    matcher: Not.IsEnabled

  - type: Screenshot
    value: "05-confirm-needs-a-reason"
    description: "The confirmation, with Confirm refused until a reason is given"

  - type: TypeText
    target: "name=PendingReasonBox"
    value: "harness run"

  - type: Expect
    target: "name=ConfirmActionButton"
    matcher: IsEnabled
    timeout: 5000

  - type: Screenshot
    value: "06-confirm-enabled"
    description: "Confirm enabled once a reason has been typed"

  # Cancelling leaves nothing behind, which is the other half of asking and
  # doing being separate steps.
  - type: Click
    target: "name=CancelActionButton"

  # Asserted on the bar, not on a control inside it. Avalonia's Control.IsVisible
  # is the control's own property, not its effective visibility, so a TextBlock
  # inside a hidden bar still reports IsVisible=true and an assertion on it
  # passes whether the bar is there or not. This failed a run with the app in
  # the right and the test wrong.
  - type: Expect
    target: "name=ActionConfirmBar"
    matcher: Not.IsVisible
    timeout: 5000

  - type: Screenshot
    value: "07-cancelled"
    description: "Cancelled: the confirmation is gone and nothing was done"

  # ---- a real pause, driven through the UI --------------------------------
  #
  # The cancel above proves nothing was done on a dismissal. This proves the
  # other half: that pressing Confirm actually reaches the Host and that the
  # console reflects the new state.
  #
  # The assertion is the button flipping from Pause to Resume. That is not
  # cosmetic: the row only offers Resume when the Host reports the principal
  # paused, and the console reloads the senders after a successful action, so
  # the flip cannot happen without the write having landed and been read back.

  - type: Click
    target: "testid=pause-sender-harness"

  - type: Expect
    target: "name=PendingActionTitle"
    matcher: ContainsText
    value: "Pause"

  - type: TypeText
    target: "name=PendingReasonBox"
    value: "harness integration run"

  - type: Click
    target: "name=ConfirmActionButton"

  - type: Expect
    target: "name=ActionResultText"
    matcher: ContainsText
    value: "Paused harness"
    timeout: 10000

  - type: Expect
    target: "testid=resume-sender-harness"
    matcher: IsVisible
    timeout: 10000

  - type: Screenshot
    value: "08-paused"
    description: "The principal paused, read back from the Host"

  # And lift it again, so the run leaves the Host as it found it.
  - type: Click
    target: "testid=resume-sender-harness"

  - type: TypeText
    target: "name=PendingReasonBox"
    value: "harness integration run complete"

  - type: Click
    target: "name=ConfirmActionButton"

  - type: Expect
    target: "name=ActionResultText"
    matcher: ContainsText
    value: "Resumed harness"
    timeout: 10000

  - type: Expect
    target: "testid=pause-sender-harness"
    matcher: IsVisible
    timeout: 10000

  # The audit trail survives the resume, which is why the Host keeps the pause
  # fields after lifting one.
  - type: Expect
    target: "testid=detail-sender-harness"
    matcher: ContainsText
    value: "Resumed by harness"

  # ---- the decision ledger ------------------------------------------------
  #
  # This entry used to be the sidebar's one blocked destination, claiming that
  # nothing enumerated the ledger. The route has existed since the listing
  # shipped: GET /v1/decisions, and the client was already complete against it.
  # So the pane is driven here as a listing rather than a blocked marker.
  #
  # The rows are the Host's, not a fixture. console_seed_decision posted an
  # assessment earlier in this run, so this is the same real decision the pane
  # above deep-links by id, reached this time by asking the ledger to list it.
  # That second reach is the point: it proves the pane can be filled from the
  # list, which no id-carrying caller could establish.

  - type: Click
    target: "type=Button:has-text(Decisions)"

  - type: Expect
    target: "name=PaneTitleText"
    matcher: HasText
    value: "Decisions"
    timeout: 15000

  # The route, on the pane, so the destination and the call it makes are the
  # same statement rather than two that could drift.
  - type: Expect
    target: "name=PaneDetailText"
    matcher: HasText
    value: "GET /v1/decisions"

  # The headline reason, in policy's own words and in full: a quoted selector is
  # an exact match against the control's whole displayed text, so this fails if
  # the row shows a code, a prefix, or anything else.
  - type: Expect
    target: "text='Semantic evidence was entirely unavailable, so no assessment of this message could be made. Responsibility is declined rather than assumed; retry when the provider is reachable.'"
    matcher: IsVisible
    timeout: 15000

  # What policy did, not what it might have done. Defer, because the semantic
  # provider was unreachable and responsibility is declined rather than assumed.
  - type: Expect
    target: "text='Defer'"
    matcher: IsVisible

  # The risk index keeps its caveat on the row. A ledger is where the number is
  # most likely to be read on its own, and it is not a probability.
  - type: Expect
    target: "text='risk index 0 (an index, not a probability)'"
    matcher: IsVisible

  # A decision resting on reduced coverage says so while scanning, which is why
  # the contract puts coverage on the summary rather than only in the detail.
  # This one had no conversation context.
  - type: Expect
    target: "text='1 coverage flag'"
    matcher: IsVisible

  - type: Screenshot
    value: "09-ledger"
    description: "The decision ledger, listing a decision the Host recorded"

  # ---- a ledger row opens the full decision -------------------------------
  #
  # A row is a summary and carries no evidence on purpose: a page of full
  # decisions is unbounded. So selecting one is a second round trip to
  # GET /v1/decisions/{id}, and this is what proves the row is the handle for
  # the explanation rather than only a line of text.
  #
  # Asserted on the pane container, not on a control inside it: Control.IsVisible
  # is the control's own property, so a TextBlock in a hidden pane still reports
  # true. Same trap as the confirmation bar, walked into twice already.
  #
  # The row's own control, not the row. The harness clicks by raising the
  # control's Click event, and a ListBoxItem does not handle one, so a click on
  # the row itself selects nothing while still reporting success. That cost a
  # run and is written up in ux-scripts/README.md.

  - type: Click
    target: "type=Button:has-text(Open decision)"

  - type: Expect
    target: "name=DecisionPaneScroll"
    matcher: IsVisible
    timeout: 10000

  - type: Expect
    target: "name=RiskIndexText"
    matcher: ContainsText
    value: "an index, not a probability"

  # The rule the whole project restates, now reached through the ledger rather
  # than through an id: a dimension nobody could measure reads "not measured",
  # never 0.00.
  - type: Expect
    target: "text='not measured (unavailable)'"
    matcher: IsVisible

  - type: Screenshot
    value: "10-ledger-decision"
    description: "The full decision opened from its ledger row"

  # ---- the connection screen ----------------------------------------------
  #
  # The screen that makes a first run possible. It is a dialog rather than a
  # pane, so every action against it names its window: an unnamed target is
  # resolved against the main window, which cannot see a modal's controls, and
  # the capture is composite because that is the only way to photograph a
  # window over its owner.
  #
  # The assertions are about what this screen refuses to do as much as what it
  # does: it never shows a stored key, and it refuses a remote plain-http
  # address, because every request carries that key in a header.

  - type: Click
    target: "type=Button:has-text(Connection)"
    description: "Open the connection screen"

  - type: Wait
    value: "700"

  - type: Expect
    target: "text='Connect to a Host'"
    window_id: ApiKeyDialog
    matcher: IsVisible
    timeout: 5000

  # Says whether a key is held, and never what it is.
  - type: Expect
    target: "text='A key is stored. Its value cannot be shown, here or anywhere else.'"
    window_id: ApiKeyDialog
    matcher: IsVisible

  - type: Screenshot
    value: "12-connection"
    composite: true
    description: "The connection screen over the console"

  # A remote plain-http Host is refused, because the key would travel in clear
  # text and that key can read every decision and release every quarantine.
  - type: TypeText
    target: "name=HostAddressBox"
    window_id: ApiKeyDialog
    value: "http://stylomail.example.test"

  - type: Click
    target: "name=SaveKeyButton"
    window_id: ApiKeyDialog

  - type: Expect
    target: "name=HostRefusalText"
    window_id: ApiKeyDialog
    matcher: IsVisible
    timeout: 5000

  - type: Screenshot
    value: "13-connection-refused"
    composite: true
    description: "A remote plain-http address refused, with the reason"

  - type: Click
    target: "name=CancelKeyButton"
    window_id: ApiKeyDialog

  # ---- the sender profile --------------------------------------------------
  #
  # The management screen, over a sender the run seeded. It is a dialog, so it
  # names its window like the connection screen does.

  - type: Click
    target: "testid=profile-sender-harness"
    description: "Open the seeded sender's profile"

  - type: Wait
    value: "800"

  - type: Expect
    target: "text='Sender profile'"
    window_id: SenderProfileDialog
    matcher: IsVisible
    timeout: 10000

  # The two fields that are stored and read by nothing say so on the form,
  # rather than looking like controls that work.
  - type: Expect
    target: "text='Stored and shown. No part of the pipeline reads it yet, so this records a stance rather than enforcing one.'"
    window_id: SenderProfileDialog
    matcher: IsVisible

  - type: Screenshot
    value: "14-sender-profile"
    composite: true
    description: "The sender profile form, with the not-yet-read fields labelled"

  - type: Click
    target: "name=CancelProfileButton"
    window_id: SenderProfileDialog

  # ---- the company screen --------------------------------------------------
  #
  # The run seeded Acme through the same routes this screen uses, so the list
  # has something in it and the assertion is about a real company rather than
  # an empty state.

  - type: Click
    target: "type=Button:has-text(Companies)"
    description: "Open the company screen"

  - type: Wait
    value: "800"

  - type: Expect
    target: "text='Company'"
    window_id: CompaniesDialog
    matcher: IsVisible
    timeout: 10000

  - type: Expect
    target: "text=Acme"
    window_id: CompaniesDialog
    matcher: IsVisible

  - type: Screenshot
    value: "15-companies"
    composite: true
    description: "The company screen, over the seeded company"

  - type: Click
    target: "name=CloseCompaniesButton"
    window_id: CompaniesDialog
