name: console-profile-history-capture
description: Governed harness data through the real Host and normal console routes.
default_delay: 250
actions:
  - type: Expect
    target: "name=StatusHeadlineText"
    matcher: ContainsText
    value: "Connected"
    timeout: 15000
  - type: Expect
    target: "testid=profile-sender-harness"
    matcher: IsVisible
    timeout: 20000
  - type: Click
    target: "testid=profile-sender-harness"
  - type: Expect
    target: "name=EntityProfileTitle"
    window_id: EntityProfileDialog
    matcher: HasText
    value: "Harness Billing"
    timeout: 15000
  - type: Expect
    target: "name=RelationshipAgeText"
    window_id: EntityProfileDialog
    matcher: ContainsText
    value: "Relationship observed since"
  - type: Expect
    target: "name=ProfileCoverageText"
    window_id: EntityProfileDialog
    matcher: ContainsText
    value: "Coverage:"
  - type: Expect
    target: "testid=profile-kpi-responsiveness-address-reciprocity-observation"
    window_id: EntityProfileDialog
    matcher: ContainsText
    value: "Observed: 80%"
  - type: Expect
    target: "testid=profile-kpi-responsiveness-address-reciprocity-trend"
    window_id: EntityProfileDialog
    matcher: ContainsText
    value: "Trend: up (+60 percentage points)"
  - type: Expect
    target: "testid=profile-kpi-responsiveness-address-reciprocity-evidence"
    window_id: EntityProfileDialog
    matcher: ContainsText
    value: "Evidence:"
  - type: Expect
    target: "testid=profile-kpi-sensitive-requests-model-prevalence-observation"
    window_id: EntityProfileDialog
    matcher: ContainsText
    value: "Not produced: signal_not_produced"
  - type: Screenshot
    value: "01-governed-profile-produced"
    window_id: EntityProfileDialog
    description: "Governed harness data — real Host and routes: profile header, produced trend, and opaque KPI evidence rows."
  - type: Scroll
    value: down
    window_id: EntityProfileDialog
  - type: Scroll
    value: down
    window_id: EntityProfileDialog
  - type: Wait
    value: "250"
    window_id: EntityProfileDialog
  - type: Screenshot
    value: "02-governed-profile-not-produced"
    window_id: EntityProfileDialog
    description: "Governed harness data — real Host and routes: named non-produced KPI state."
