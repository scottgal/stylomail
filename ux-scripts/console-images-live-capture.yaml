name: console-images-live-capture
description: >
  External-Host capture of the Images page over a real observation. The second
  conversation is the one with the image; no fixture.

default_delay: 500
actions:
  - type: Expect
    target: "name=StatusHeadlineText"
    matcher: HasText
    value: "Connected"
    timeout: 20000

  - type: Click
    target: "type=Button:has-text(Images)"
    description: "Open the image observation page"

  - type: Expect
    target: "testid=images-page"
    matcher: IsVisible
    timeout: 15000

  - type: Expect
    target: "testid=images-conversations"
    matcher: IsVisible

  - type: SelectDropDownItem
    target: "testid=images-conversations"
    value: "1"

  - type: Wait
    value: "1500"

  - type: Expect
    target: "testid=images-messages"
    matcher: IsVisible
    timeout: 20000

  - type: Scroll
    target: "name=ImagesScroll"
    value: down

  - type: Wait
    value: "500"

  - type: Expect
    target: "testid=image-observation"
    matcher: IsVisible
    timeout: 20000

  - type: Screenshot
    value: "images-1180x720"
    composite: true
    description: "Images page at 1180x720 over a real observation: thread picker, counts, format, dimensions and findings"
